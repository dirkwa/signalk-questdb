name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

      # The tag release-please just pushed does not start publish.yml by
      # itself: an event raised with GITHUB_TOKEN starts no workflow, with
      # workflow_dispatch as the exception. So publish.yml is dispatched on
      # the tag — it has to stay the file that publishes, since npm's
      # trusted publishing is bound to that workflow file.
      - name: Publish the release
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.rp.outputs.tag_name }}"
