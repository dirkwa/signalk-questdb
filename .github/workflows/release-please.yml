name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # The tag release-please pushes on merging its release PR is what
      # triggers publish.yml, and npm's trusted publishing is bound to that
      # workflow file. A tag pushed with GITHUB_TOKEN triggers nothing, so
      # a personal access token (contents + pull-requests) is required —
      # better to fail here than to cut a release that never reaches npm.
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set; a tag pushed with GITHUB_TOKEN would not trigger publish.yml"
            exit 1
          fi

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
